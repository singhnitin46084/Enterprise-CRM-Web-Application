<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Enterprise CRM - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand font-monospace" href="/customers">Enterprise CRM</a>
    <div class="ms-auto text-white">
        Logged in as: <strong sec:authentication="name"></strong> (<span sec:authentication="principal.authorities"></span>)
        <a href="/logout" class="btn btn-sm btn-outline-danger ms-3">Logout</a>
    </div>
</nav>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Customer Management</h2>
        <a sec:authorize="hasAnyRole('ADMIN', 'MANAGER')" href="/customers/new" class="btn btn-primary">+ Add New Customer</a>
    </div>

    <!-- Filter Form -->
    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/customers}" method="get" class="row g-3">
                <div class="col-md-5">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by name, email, or company...">
                </div>
                <div class="col-md-4">
                    <select name="status" class="form-select">
                        <option value="">All Statuses</option>
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${st == selectedStatus}"></option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-secondary w-100">Filter</button>
                    <a href="/customers" class="btn btn-outline-secondary">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Customer Table -->
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Company</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="customer : ${customers}">
                    <td th:text="${customer.id}">1</td>
                    <td class="fw-semibold" th:text="${customer.firstName + ' ' + customer.lastName}">John Doe</td>
                    <td th:text="${customer.email}">john@example.com</td>
                    <td th:text="${customer.phone}">1234567890</td>
                    <td th:text="${customer.company}">Acme Corp</td>
                    <td>
                        <span class="badge bg-primary" th:text="${customer.status}">NEW</span>
                    </td>
                    <td class="text-end">
                        <a sec:authorize="hasAnyRole('ADMIN', 'MANAGER')" th:href="@{/customers/edit/{id}(id=${customer.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/customers/delete/{id}(id=${customer.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this record?');">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(customers)}">
                    <td colspan="7" class="text-center py-4 text-muted">No customer records found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
